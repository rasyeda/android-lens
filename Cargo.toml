[workspace]
resolver = "2"
members = [
    "crates/adb-bridge",
    "crates/jdwp-client",
    "crates/logcat-stream",
    "crates/app-inspector",
    "crates/mcp-server",
    "crates/cli-poc",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
